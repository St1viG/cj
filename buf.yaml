# buf workspace: lint, breaking-change detection and the module root for
# codegen (ADR-0006). `make lint` runs `buf lint` and `buf breaking`.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  ignore_only:
    # The agent stream keeps the SPEC §8.2 names: service AgentGateway,
    # messages AgentMessage and ControlMessage.
    SERVICE_SUFFIX:
      - proto/kondukter/agent/v1/agent.proto
    RPC_REQUEST_STANDARD_NAME:
      - proto/kondukter/agent/v1/agent.proto
    RPC_RESPONSE_STANDARD_NAME:
      - proto/kondukter/agent/v1/agent.proto
breaking:
  use:
    - FILE
