document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

<\u002Fa><\u002Fsc-if>\n<\u002Fnav>\n<span class=\"sp\"><\u002Fspan>\n<sc-if value=\"{{ signedIn }}\"><span class=\"live s-run\" title=\"Pages refresh every few seconds\"><span class=\"led\" aria-hidden=\"true\"><\u002Fspan><span>LIVE<\u002Fspan><\u002Fspan><\u002Fsc-if>\n<button type=\"button\" class=\"sm g themebtn\" aria-label=\"Switch colour theme\" sc-camel-on-click=\"{{ toggleTheme }}\">{{ themeWord }}<\u002Fbutton>\n<sc-if value=\"{{ isCustomer }}\"><a href=\"#/app/billing\" class=\"balance\" title=\"Balance\"><span class=\"lbl\">Balance<\u002Fspan><span class=\"m ink-h\">{{ balance }}<\u002Fspan><\u002Fa><\u002Fsc-if>\n<sc-if value=\"{{ signedIn }}\"><span class=\"acct\"><span class=\"who-email m\" title=\"{{ email }}\">{{ email }}<\u002Fspan><span class=\"chip role\">{{ roleLabel }}<\u002Fspan><button type=\"button\" class=\"sm\" sc-camel-on-click=\"{{ logout }}\">Log out<\u002Fbutton><\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ signedOut }}\" hint-placeholder-val=\"{{ true }}\"><a class=\"btn p\" href=\"#/login\">Log in<\u002Fa><\u002Fsc-if>\n<\u002Fheader>\n<\u002Fsc-if>\n<sc-if value=\"{{ pg.landing }}\" hint-placeholder-val=\"{{ true }}\">\n<main>\n<section class=\"hero\">\n<div class=\"hero-aura\" aria-hidden=\"true\"><\u002Fdiv>\n<div class=\"hero-copy\" style=\"position: relative; z-index: 1\">\n<span class=\"lbl\">Compute, on demand<\u002Fspan>\n<h1><span class=\"w\"><span style=\"--i: 0\">Idle<\u002Fspan><\u002Fspan> <span class=\"w\"><span style=\"--i: 1\">capacity,<\u002Fspan><\u002Fspan> <span class=\"w\"><span style=\"--i: 2\">ready<\u002Fspan><\u002Fspan> <span class=\"w\"><span style=\"--i: 3\">in<\u002Fspan><\u002Fspan> <span class=\"w\"><span style=\"--i: 4\">seconds.<\u002Fspan><\u002Fspan><\u002Fh1>\n<p class=\"lead\">Warden turns spare datacenter machines, GPUs included, into SSH-ready virtual machines. Partners put idle hardware to work; customers rent a whole GPU by the minute.<\u002Fp>\n<div class=\"row\" style=\"gap: 8px\">\n<span class=\"chip s-run\">from €0.05/hr · cpu<\u002Fspan>\n<span class=\"chip gpu\">gtx 1060 · €0.40/hr · available now<\u002Fspan>\n<span class=\"chip gpu\">h100 · b200 from €1.89/hr<\u002Fspan>\n<\u002Fdiv>\n<div class=\"row\">\n<a class=\"btn p lg\" href=\"{{ authHref }}\">{{ authLabel }}<\u002Fa>\n<a class=\"btn lg\" href=\"#/products\">Browse products<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<dc-import name=\"Warden Hero Demo\" hint-size=\"100%,360px\"><\u002Fdc-import>\n<\u002Fsection>\n<div class=\"land-stats\">\n<div class=\"stat reg\"><span class=\"lbl\">Inbound ports opened<\u002Fspan><span class=\"v\" data-from=\"8\" data-count=\"0\">0<\u002Fspan><\u002Fdiv>\n<div class=\"stat reg\"><span class=\"lbl\">GPU per tenant<\u002Fspan><span class=\"v\">1<small>whole card<\u002Fsmall><\u002Fspan><\u002Fdiv>\n<div class=\"stat reg\"><span class=\"lbl\">Lost node noticed in<\u002Fspan><span class=\"v\" data-from=\"0\" data-count=\"45\">45<small>seconds<\u002Fsmall><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<section id=\"plans\" class=\"land-sec\">\n<div class=\"sec-head\"><span class=\"lbl\">Pricing<\u002Fspan><h2>Simple prices. Real hardware.<\u002Fh2><\u002Fdiv>\n<div class=\"plans\">\n<sc-for list=\"{{ L.plans }}\" as=\"p\" hint-placeholder-count=\"4\">\n<article class=\"card reg col plan\" data-featured=\"{{ p.featuredAttr }}\">\n<div class=\"row\"><span class=\"{{ p.kindCls }}\">{{ p.kindWord }}<\u002Fspan><span class=\"sp\"><\u002Fspan><sc-if value=\"{{ p.featured }}\"><span class=\"chip s-run\"><span class=\"led\" aria-hidden=\"true\"><\u002Fspan>Most popular<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ p.plain }}\"><span class=\"chip s-run\"><span class=\"led\" aria-hidden=\"true\"><\u002Fspan>Available now<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n<div class=\"col\" style=\"gap: 6px\"><h3 class=\"m\">{{ p.name }}<\u002Fh3><p class=\"mut plan-blurb\">{{ p.blurb }}<\u002Fp><\u002Fdiv>\n<div class=\"col\" style=\"gap: 4px\"><div class=\"plan-price\">{{ p.price }}<small>/ hour<\u002Fsmall><\u002Fdiv><span class=\"mut2 m\">{{ p.sub }}<\u002Fspan><\u002Fdiv>\n<ul class=\"ticks plan-specs\"><sc-for list=\"{{ p.specs }}\" as=\"sp\"><li>{{ sp.t }}<\u002Fli><\u002Fsc-for><\u002Ful>\n<div class=\"plan-cta\"><sc-if value=\"{{ p.featured }}\"><a class=\"btn p lg\" href=\"{{ p.href }}\">{{ p.label }}<\u002Fa><\u002Fsc-if><sc-if value=\"{{ p.plain }}\"><a class=\"btn lg\" href=\"{{ p.href }}\">{{ p.label }}<\u002Fa><\u002Fsc-if><\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p class=\"note\">Prices are per hour, billed by the minute, in euro. Every shape is dedicated capacity: one tenant per machine slot, one tenant per GPU.<\u002Fp>\n<div class=\"eg-head\"><span class=\"lbl\">What a GTX 1060 costs in practice<\u002Fspan><\u002Fdiv>\n<div class=\"g3\">\n<sc-for list=\"{{ L.examples }}\" as=\"e\" hint-placeholder-count=\"3\">\n<article class=\"card reg col eg\"><span class=\"lbl\">{{ e.label }}<\u002Fspan><div class=\"eg-price\">{{ e.price }}<\u002Fdiv><span class=\"mut2 m\">{{ e.caption }}<\u002Fspan><\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"cheap\" class=\"land-sec\">\n<div class=\"sec-head\"><span class=\"lbl\">Cheap by design<\u002Fspan><h2>Pennies an hour. Seriously.<\u002Fh2><\u002Fdiv>\n<div class=\"cheap-grid\">\n<div class=\"card reg glow calc\">\n<div class=\"seg\" role=\"group\" aria-label=\"Shape\"><sc-for list=\"{{ L.shapes }}\" as=\"sh\" hint-placeholder-count=\"2\"><button type=\"button\" aria-pressed=\"{{ sh.pressed }}\" sc-camel-on-click=\"{{ sh.pick }}\">{{ sh.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div class=\"fld\"><label for=\"calc-hours\">Run it for <span class=\"m ink-h\">{{ L.hours }} h<\u002Fspan><\u002Flabel><input id=\"calc-hours\" type=\"range\" min=\"1\" max=\"168\" value=\"{{ L.hours }}\" sc-camel-on-change=\"{{ L.setHours }}\"><\u002Fdiv>\n<div><span class=\"lbl\">That costs<\u002Fspan><div class=\"calc-total\" aria-live=\"polite\">{{ L.total }}<\u002Fdiv><p class=\"mut m\">{{ L.note }}<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"col\">\n<article class=\"card col\"><h3>Idle hardware, already paid for<\u002Fh3><p class=\"mut\">Partners lend machines that would otherwise sit unused. Capacity that costs them almost nothing extra costs you pennies.<\u002Fp><\u002Farticle>\n<article class=\"card col\"><h3>Billed by the minute<\u002Fh3><p class=\"mut\">You pay for the minutes an instance runs, not for a rounded-up hour. Stop it after ten minutes and you pay for ten.<\u002Fp><\u002Farticle>\n<article class=\"card col\"><h3>No middle layer<\u002Fh3><p class=\"mut\">Your traffic goes straight to the node. We never carry it, so there is no bandwidth to mark up.<\u002Fp><\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"note\">Prices are per hour and billed by the minute. New accounts start with credit: log in and open Billing to see your balance, its history and an invoice.<\u002Fp>\n<\u002Fsection>\n<section id=\"what\" class=\"land-sec\">\n<div class=\"sec-head\"><span class=\"lbl\">What we do<\u002Fspan><h2>Hardware that sat idle, put to work.<\u002Fh2><\u002Fdiv>\n<div class=\"g3\">\n<article class=\"card reg col\"><span class=\"m acc\">01<\u002Fspan><h3>Partners lend idle capacity<\u002Fh3><p class=\"mut\">Datacenters, labs and universities dedicate a fixed share of machines that would otherwise sit idle. They install one small agent; nothing opens inbound.<\u002Fp><\u002Farticle>\n<article class=\"card reg col\"><span class=\"m acc\">02<\u002Fspan><h3>Warden schedules it<\u002Fh3><p class=\"mut\">A control plane knows every node, GPU and free core. It places each request on the best-fit machine and keeps the books straight in one database.<\u002Fp><\u002Farticle>\n<article class=\"card reg col\"><span class=\"m acc\">03<\u002Fspan><h3>Customers get a real VM<\u002Fh3><p class=\"mut\">Pick a shape and an image, add an SSH key, and a few seconds later you log in to a whole virtual machine, with a whole GPU when you ask for one.<\u002Fp><\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"how\" class=\"land-sec\">\n<div class=\"sec-head\"><span class=\"lbl\">How it works<\u002Fspan><h2>Calm by default, even when things break.<\u002Fh2><\u002Fdiv>\n<div class=\"scrolly\">\n<aside class=\"pin\" aria-hidden=\"true\"><div class=\"card reg glow pin-card\"><div class=\"row\"><span class=\"lbl\">How a node comes online<\u002Fspan><span class=\"sp\"><\u002Fspan><span class=\"m mut2 pin-count\">01 / 04<\u002Fspan><\u002Fdiv><div class=\"pin-track\"><span class=\"pin-fill\"><\u002Fspan><span class=\"pin-st now\"><i class=\"nd\"><\u002Fi><span>Dial out<\u002Fspan><\u002Fspan><span class=\"pin-st\"><i class=\"nd\"><\u002Fi><span>Reconcile<\u002Fspan><\u002Fspan><span class=\"pin-st\"><i class=\"nd\"><\u002Fi><span>Passthrough<\u002Fspan><\u002Fspan><span class=\"pin-st\"><i class=\"nd\"><\u002Fi><span>Direct<\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"term\"><header><span class=\"lbl pin-title\">agent · dial out<\u002Fspan><span class=\"acts\"><span class=\"chip s-run\"><span class=\"led\"><\u002Fspan>live<\u002Fspan><\u002Fspan><\u002Fheader><div class=\"pin-stage\"><div class=\"pin-scene on\" data-title=\"agent · dial out\"><span style=\"--n: 0\"><b class=\"k\">$<\u002Fb> warden-agent --server control.warden<\u002Fspan><span style=\"--n: 1\"><i class=\"d\">dialing out :443 · mutual TLS<\u002Fi><\u002Fspan><span style=\"--n: 2\"><i class=\"ok\">✓ stream open · inbound ports: 0<\u002Fi><\u002Fspan><\u002Fdiv><div class=\"pin-scene\" data-title=\"agent · reconcile\"><span style=\"--n: 0\"><i class=\"d\">control plane unreachable · 12 s<\u002Fi><\u002Fspan><span style=\"--n: 1\">running VMs: 3 · deleted: 0<\u002Fspan><span style=\"--n: 2\"><i class=\"ok\">✓ reconnected · desired gen 42 = observed 42<\u002Fi><\u002Fspan><\u002Fdiv><div class=\"pin-scene\" data-title=\"node · gpu passthrough\"><span style=\"--n: 0\"><b class=\"k\">$<\u002Fb> vfio-pci bind 0000:01:00.0<\u002Fspan><span style=\"--n: 1\">gpu 0 → i-7c1e <i class=\"d\">(exclusive)<\u002Fi><\u002Fspan><span style=\"--n: 2\"><i class=\"ok\">✓ guest sees GeForce GTX 1060 6GB<\u002Fi><\u002Fspan><\u002Fdiv><div class=\"pin-scene\" data-title=\"you · direct access\"><span style=\"--n: 0\"><b class=\"k\">$<\u002Fb> ssh -p 40001 ubuntu@100.64.0.5<\u002Fspan><span style=\"--n: 1\"><i class=\"d\">bytes carried by Warden: 0<\u002Fi><\u002Fspan><span style=\"--n: 2\"><i class=\"ok\">✓ session open · node ⇄ you<\u002Fi><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Faside>\n<div class=\"steps\">\n<article class=\"card col step\" data-i=\"0\"><span class=\"m mut2\">01<\u002Fspan><h3>Agents dial out<\u002Fh3><p class=\"mut\">Every node keeps one outbound, mutually authenticated stream to the control plane. No inbound ports, no VPN per partner.<\u002Fp><\u002Farticle>\n<article class=\"card col step\" data-i=\"1\"><span class=\"m mut2\">02<\u002Fspan><h3>Desired state, reconciled<\u002Fh3><p class=\"mut\">The control plane says what should run; the agent converges to it. If the link drops, running VMs keep running and nothing is deleted.<\u002Fp><\u002Farticle>\n<article class=\"card col step\" data-i=\"2\"><span class=\"m mut2\">03<\u002Fspan><h3>Whole-GPU passthrough<\u002Fh3><p class=\"mut\">A GPU is handed to exactly one tenant through VFIO, so the guest runs NVIDIA's own driver at full speed. No sharing, no slicing.<\u002Fp><\u002Farticle>\n<article class=\"card col step\" data-i=\"3\"><span class=\"m mut2\">04<\u002Fspan><h3>Direct access<\u002Fh3><p class=\"mut\">You connect straight to the node. Customer traffic never flows through Warden, and an outage there never takes your session down.<\u002Fp><\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"included\" class=\"land-sec\">\n<div class=\"sec-head\"><span class=\"lbl\">Included with every instance<\u002Fspan><h2>Everything you need to start, nothing to bolt on.<\u002Fh2><\u002Fdiv>\n<div class=\"g3\">\n<article class=\"card reg col feat\"><span class=\"ico\" aria-hidden=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><path d=\"M12 7.5V12l3 2\"/><\u002Fsvg><\u002Fspan><h3>Per-minute billing<\u002Fh3><p class=\"mut\">You pay for the minutes an instance runs. Stop it after ten minutes and you pay for ten, with a live cost estimate on every instance.<\u002Fp><span class=\"pill\">Billing<\u002Fspan><\u002Farticle>\n<article class=\"card reg col feat\"><span class=\"ico\" aria-hidden=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"10\" rx=\"1\"/><circle cx=\"9\" cy=\"12\" r=\"2.2\"/><path d=\"M14 10h4M14 14h4M6 17v2M10 17v2\"/><\u002Fsvg><\u002Fspan><h3>A whole GPU, yours alone<\u002Fh3><p class=\"mut\">The card is handed to exactly one tenant through VFIO passthrough. NVIDIA&#39;s own driver, full speed, no sharing and no slicing.<\u002Fp><span class=\"pill\">Isolation<\u002Fspan><\u002Farticle>\n<article class=\"card reg col feat\"><span class=\"ico\" aria-hidden=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1\"/><path d=\"M7 10l3 2.5L7 15M12.5 15H17\"/><\u002Fsvg><\u002Fspan><h3>Direct SSH<\u002Fh3><p class=\"mut\">Copy one command and connect straight to the node. Your traffic never flows through Warden, so there is no bandwidth to mark up.<\u002Fp><span class=\"pill\">Access<\u002Fspan><\u002Farticle>\n<article class=\"card reg col feat\"><span class=\"ico\" aria-hidden=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"12\" cy=\"7\" rx=\"7\" ry=\"3\"/><path d=\"M5 7v10c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3\"/><\u002Fsvg><\u002Fspan><h3>Curated images<\u002Fh3><p class=\"mut\">Ubuntu 24.04 on amd64 and arm64, with the NVIDIA driver and CUDA pre-installed on GPU shapes. Ready at the first login.<\u002Fp><span class=\"pill\">Images<\u002Fspan><\u002Farticle>\n<article class=\"card reg col feat\"><span class=\"ico\" aria-hidden=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5C6.8 5 6.5 6 6.5 8v1.5c0 1.3-.8 2.2-2.5 2.5 1.7.3 2.5 1.2 2.5 2.5V16c0 2 .3 3 2.5 3M15 5c2.2 0 2.5 1 2.5 3v1.5c0 1.3.8 2.2 2.5 2.5-1.7.3-2.5 1.2-2.5 2.5V16c0 2-.3 3-2.5 3\"/><\u002Fsvg><\u002Fspan><h3>Cloud-init and open ports<\u002Fh3><p class=\"mut\">Bring your own user-data, up to 16 KiB, and expose extra TCP or UDP ports at launch. 22/tcp is always there.<\u002Fp><span class=\"pill\">Automation<\u002Fspan><\u002Farticle>\n<article class=\"card reg col feat\"><span class=\"ico\" aria-hidden=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"8\" cy=\"12\" r=\"3.5\"/><path d=\"M11.5 12H21M17 12v3M20 12v2.5\"/><\u002Fsvg><\u002Fspan><h3>API keys and kctl<\u002Fh3><p class=\"mut\">Create keys in the console and drive everything from kctl or your own tools. A key is shown once and can be revoked at any time.<\u002Fp><span class=\"pill\">API<\u002Fspan><\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"usecases\" class=\"land-sec\">\n<div class=\"sec-head\"><span class=\"lbl\">GeForce GTX 1060 6GB<\u002Fspan><h2>The everyday GPU, ready now.<\u002Fh2><\u002Fdiv>\n<div class=\"uc\">\n<article class=\"card reg glow col spec\">\n<div class=\"row\"><span class=\"chip gpu\">gpu-gtx1060-1x<\u002Fspan><span class=\"sp\"><\u002Fspan><span class=\"chip s-run\"><span class=\"led\" aria-hidden=\"true\"><\u002Fspan>Available now<\u002Fspan><\u002Fdiv>\n<div class=\"col\" style=\"gap: 4px\"><div class=\"plan-price\">€0.40<small>/ hour<\u002Fsmall><\u002Fdiv><span class=\"mut2 m\">€9.60/day · €292.00/mo · billed by the minute<\u002Fspan><\u002Fdiv>\n<dl class=\"specs\"><dt>GPU<\u002Fdt><dd>GeForce GTX 1060 6GB × 1<\u002Fdd><dt>Architecture<\u002Fdt><dd>Pascal · 1280 CUDA cores<\u002Fdd><dt>Memory<\u002Fdt><dd>6 GB GDDR5<\u002Fdd><dt>Compute<\u002Fdt><dd>4 vCPU · 8 GiB RAM · 40 GiB disk<\u002Fdd><dt>Image<\u002Fdt><dd>Ubuntu 24.04 · NVIDIA driver · CUDA 12<\u002Fdd><dt>Capacity<\u002Fdt><dd>Dedicated, one tenant per GPU<\u002Fdd><\u002Fdl>\n<div class=\"plan-cta\"><a class=\"btn p lg\" href=\"{{ authHref }}\">{{ L.gpuCta }}<\u002Fa><\u002Fdiv>\n<\u002Farticle>\n<div class=\"uc-grid\">\n<article class=\"card reg col feat\"><span class=\"ico\" aria-hidden=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"1\"/><path d=\"M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3\"/><\u002Fsvg><\u002Fspan><h3>CUDA development and CI<\u002Fh3><p class=\"mut\">A clean GPU machine to build and test CUDA code on Pascal, billed only while the job runs.<\u002Fp><span class=\"pill\">CUDA 12 · sm_61<\u002Fspan><\u002Farticle>\n<article class=\"card reg col feat\"><span class=\"ico\" aria-hidden=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"6\" cy=\"12\" r=\"2\"/><circle cx=\"18\" cy=\"6\" r=\"2\"/><circle cx=\"18\" cy=\"18\" r=\"2\"/><path d=\"M8 12h4l4-5M12 12l4 5\"/><\u002Fsvg><\u002Fspan><h3>Small-model inference<\u002Fh3><p class=\"mut\">Serve quantized models and embeddings that fit in 6 GB of VRAM, on a port you choose at launch.<\u002Fp><span class=\"pill\">6 GB VRAM<\u002Fspan><\u002Farticle>\n<article class=\"card reg col feat\"><span class=\"ico\" aria-hidden=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"5\" width=\"16\" height=\"14\" rx=\"1\"/><path d=\"M4 9h16M4 15h16M8 5v14M16 5v14\"/><\u002Fsvg><\u002Fspan><h3>Video transcode and render<\u002Fh3><p class=\"mut\">Offload hardware H.264 and HEVC encodes and GPU-accelerated renders without owning the card.<\u002Fp><span class=\"pill\">NVENC<\u002Fspan><\u002Farticle>\n<article class=\"card reg col feat\"><span class=\"ico\" aria-hidden=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 5h9a3 3 0 013 3v11H8a3 3 0 01-3-3V5zM9 9h5M9 12.5h5\"/><\u002Fsvg><\u002Fspan><h3>Notebooks and data prep<\u002Fh3><p class=\"mut\">Log in to a ready Ubuntu box, run Jupyter or your scripts, terminate when you are done.<\u002Fp><span class=\"pill\">Ubuntu 24.04<\u002Fspan><\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"offer\" class=\"land-sec\">\n<div class=\"sec-head\"><span class=\"lbl\">What we offer<\u002Fspan><h2>A small, honest catalog.<\u002Fh2><\u002Fdiv>\n<div class=\"tw\"><sc-raw-table class=\"tbl\" style=\"min-width: 640px\"><sc-raw-caption>Catalog, dedicated capacity<\u002Fsc-raw-caption><sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\">Shape<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Accelerator<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Size<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Architecture<\u002Fsc-raw-th><sc-raw-th scope=\"col\" class=\"num\">Price / hour<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td class=\"m ink-h\">cpu-2x2<\u002Fsc-raw-td><sc-raw-td>none<\u002Fsc-raw-td><sc-raw-td class=\"m\">2 vCPU · 2 GiB · 20 GiB<\u002Fsc-raw-td><sc-raw-td class=\"m\">arm64 · amd64<\u002Fsc-raw-td><sc-raw-td class=\"m ink-h num\">€0.05<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td class=\"m ink-h\">gpu-gtx1060-1x<\u002Fsc-raw-td><sc-raw-td><span class=\"chip gpu\">GeForce GTX 1060 6GB × 1<\u002Fspan><\u002Fsc-raw-td><sc-raw-td class=\"m\">4 vCPU · 8 GiB · 40 GiB<\u002Fsc-raw-td><sc-raw-td class=\"m\">amd64<\u002Fsc-raw-td><sc-raw-td class=\"m ink-h num\">€0.40<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td class=\"m ink-h\">gpu-h100-1x<\u002Fsc-raw-td><sc-raw-td><span class=\"chip gpu\">NVIDIA H100 80GB HBM3 × 1<\u002Fspan><\u002Fsc-raw-td><sc-raw-td class=\"m\">24 vCPU · 192 GiB · 500 GiB<\u002Fsc-raw-td><sc-raw-td class=\"m\">amd64<\u002Fsc-raw-td><sc-raw-td class=\"m ink-h num\">€1.89<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td class=\"m ink-h\">gpu-b200-1x<\u002Fsc-raw-td><sc-raw-td><span class=\"chip gpu\">NVIDIA B200 180GB × 1<\u002Fspan><\u002Fsc-raw-td><sc-raw-td class=\"m\">32 vCPU · 256 GiB · 1000 GiB<\u002Fsc-raw-td><sc-raw-td class=\"m\">amd64<\u002Fsc-raw-td><sc-raw-td class=\"m ink-h num\">€3.49<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p class=\"note\">Curated Ubuntu 24.04 images, with the NVIDIA driver and CUDA pre-installed on GPU shapes.<\u002Fp>\n<div class=\"row\"><a class=\"btn\" href=\"#/products\">Compare all products<\u002Fa><\u002Fdiv>\n<\u002Fsection>\n<section id=\"who\" class=\"land-sec\">\n<div class=\"sec-head\"><span class=\"lbl\">Who it is for<\u002Fspan><h2>One platform, three views.<\u002Fh2><\u002Fdiv>\n<div class=\"g3\">\n<article class=\"card reg col\"><h3>Customers<\u002Fh3><p class=\"mut\">Browse offers, create an instance, watch it come up live, copy the ssh command, and see running time and estimated cost.<\u002Fp><ul class=\"ticks\"><li>Offers and filters<\u002Fli><li>Live lifecycle<\u002Fli><li>SSH and API keys<\u002Fli><\u002Ful><\u002Farticle>\n<article class=\"card reg col\"><h3>Partners<\u002Fh3><p class=\"mut\">See your sites and nodes, enroll a machine with a one-time command, drain it for maintenance, and read utilization. Never customer data.<\u002Fp><ul class=\"ticks\"><li>Sites and nodes<\u002Fli><li>One-time enrollment<\u002Fli><li>Drain and undrain<\u002Fli><\u002Ful><\u002Farticle>\n<article class=\"card reg col\"><h3>Operators<\u002Fh3><p class=\"mut\">Watch the whole fleet, quarantine a node, force-terminate an instance and read the audit log. Every privileged action is recorded.<\u002Fp><ul class=\"ticks\"><li>Fleet map and stage view<\u002Fli><li>Quarantine<\u002Fli><li>Audit log<\u002Fli><\u002Ful><\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"faq\" class=\"land-sec\">\n<div class=\"sec-head\"><span class=\"lbl\">Questions<\u002Fspan><h2>Answers before you ask.<\u002Fh2><\u002Fdiv>\n<div class=\"faq\">\n<details class=\"card reg\"><summary>How does billing work?<\u002Fsummary><p class=\"ans\">Instances are billed by the minute at the hourly price of their shape, so a GTX 1060 costs 0.67 cents a minute. You top up your balance with €10, €25, €50 or €100, and Billing shows your balance, daily burn, runway and an invoice per month.<\u002Fp><\u002Fdetails>\n<details class=\"card reg\"><summary>What do I get when I launch an instance?<\u002Fsummary><p class=\"ans\">A whole virtual machine on a dedicated slot: Ubuntu 24.04, your SSH keys, the ports you choose and optional cloud-init user-data. GPU shapes come with the NVIDIA driver and CUDA already installed.<\u002Fp><\u002Fdetails>\n<details class=\"card reg\"><summary>How do I connect?<\u002Fsummary><p class=\"ans\">Open the instance, copy the ssh command and run it. You connect straight to the node, and the page lists the host, the SSH port and a mapping for every exposed port.<\u002Fp><\u002Fdetails>\n<details class=\"card reg\"><summary>Is the GPU shared with anyone?<\u002Fsummary><p class=\"ans\">No. A GPU is passed through to exactly one tenant with VFIO, so the guest runs NVIDIA&#39;s own driver at full speed. There is no GPU sharing and no slicing.<\u002Fp><\u002Fdetails>\n<details class=\"card reg\"><summary>What happens if a node goes down?<\u002Fsummary><p class=\"ans\">Every node keeps one outbound stream to the control plane, and a lost node is noticed in 45 seconds. If only the link drops, running VMs keep running and nothing is deleted. You see the phase change live on your instance.<\u002Fp><\u002Fdetails>\n<details class=\"card reg\"><summary>Can I automate it?<\u002Fsummary><p class=\"ans\">Yes. Create an API key under Keys and use kctl or your own tools to list offers, launch and terminate instances. Every privileged action on the platform is recorded in an audit log.<\u002Fp><\u002Fdetails>\n<details class=\"card reg\"><summary>How do partners get paid?<\u002Fsummary><p class=\"ans\">Partners lend idle machines and see earnings per day and per node, utilization and payouts in their own area. They never see customer data.<\u002Fp><\u002Fdetails>\n<details class=\"card reg\"><summary>Which GPUs can I rent?<\u002Fsummary><p class=\"ans\">The GeForce GTX 1060 6GB is the everyday choice from €0.40 an hour. For heavier work the catalog also lists the NVIDIA H100 80GB and B200 180GB.<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"land-cta card reg glow\">\n<h2>Ready to look around?<\u002Fh2>\n<p class=\"mut\">Log in to see your balance, your instances or your nodes.<\u002Fp>\n<div class=\"row\" style=\"justify-content: center\"><a class=\"btn p lg\" href=\"{{ authHref }}\">{{ authLabel }}<\u002Fa><\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n<footer class=\"land-foot\">\n<span class=\"wm\" style=\"font-size: 22px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 26 26\" fill=\"none\" aria-hidden=\"true\"><rect x=\"1.5\" y=\"1.5\" width=\"23\" height=\"23\" stroke=\"var(--ink-h)\" sc-camel-stroke-width=\"1.2\"><\u002Frect><path d=\"M1.5 13H9M17 13h7.5\" stroke=\"var(--ink-h)\" sc-camel-stroke-width=\"1.2\"><\u002Fpath><circle cx=\"13\" cy=\"13\" r=\"3.2\" fill=\"var(--acc)\"><\u002Fcircle><\u002Fsvg>Warden<\u002Fspan>\n<span class=\"mut2 m\">© {{ year }} Warden<\u002Fspan>\n<\u002Ffooter>\n<\u002Fsc-if>\n<sc-if value=\"{{ pg.products }}\" hint-placeholder-val=\"{{ false }}\">\n<main class=\"pub\">\n<header class=\"pagehead glow\">\n<span class=\"lbl\">Products<\u002Fspan>\n<h1>Compute you can log in to.<\u002Fh1>\n<p class=\"lead\">Dedicated virtual machines from partner hardware: CPU shapes and whole GPUs, each with a curated image and direct SSH. Compare shapes, prices and architectures, then launch.<\u002Fp>\n<div class=\"row\">\n<span class=\"chip s-run\"><span class=\"led\" aria-hidden=\"true\"><\u002Fspan>dedicated<\u002Fspan>\n<span class=\"chip s-run\"><span class=\"led\" aria-hidden=\"true\"><\u002Fspan>ssh-ready<\u002Fspan>\n<span class=\"chip s-run\"><span class=\"led\" aria-hidden=\"true\"><\u002Fspan>whole gpu<\u002Fspan>\n<span class=\"chip s-run\"><span class=\"led\" aria-hidden=\"true\"><\u002Fspan>per-minute estimates<\u002Fspan>\n<\u002Fdiv>\n<\u002Fheader>\n<p class=\"note\">{{ P.note }}<\u002Fp>\n<div class=\"tabs\" role=\"tablist\" aria-label=\"Product type\"><sc-for list=\"{{ P.tabs }}\" as=\"t\" hint-placeholder-count=\"3\"><button type=\"button\" role=\"tab\" aria-selected=\"{{ t.selected }}\" class=\"g\" sc-camel-on-click=\"{{ t.pick }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div class=\"market\">\n<aside class=\"filters card\" aria-label=\"Filters\">\n<div class=\"row\"><span class=\"lbl\">Filters<\u002Fspan><span class=\"sp\"><\u002Fspan><button type=\"button\" class=\"sm g\" disabled=\"{{ P.noFilter }}\" sc-camel-on-click=\"{{ P.clear }}\">Clear all<\u002Fbutton><\u002Fdiv>\n<label class=\"chk\"><input type=\"checkbox\" checked=\"{{ P.avail }}\" sc-came 002Fspan><\u002Fspan><a class=\"btn sm g\" href=\"#/admin/nodes\">Exit<\u002Fa><\u002Fdiv>\n<\u002Fheader>\n<p class=\"mut m\">Updated {{ ST.updated }}, every 2 s.<\u002Fp>\n<sc-if value=\"{{ ST.none }}\"><div class=\"empty\"><p>No nodes have enrolled yet.<\u002Fp><\u002Fdiv><\u002Fsc-if>\n<div class=\"sites\"><sc-for list=\"{{ ST.sites }}\" as=\"site\"><section class=\"col\"><div class=\"row\"><span class=\"lbl\">Site<\u002Fspan><h2 class=\"disp\" style=\"font-size: 32px; margin: 0\">{{ site.name }}<\u002Fh2><span class=\"mut2 m\">{{ site.partner }}<\u002Fspan><\u002Fdiv><div class=\"nodes\"><sc-for list=\"{{ site.nodes }}\" as=\"nd\" hint-placeholder-count=\"4\"><article class=\"snode s-{{ nd.kind }}\"><div class=\"row\"><h3>{{ nd.name }}<\u002Fh3><span class=\"sp\"><\u002Fspan><span class=\"chip s-{{ nd.kind }}\"><span class=\"led\" aria-hidden=\"true\"><\u002Fspan>{{ nd.status }}<\u002Fspan><\u002Fdiv><div class=\"row mut m\"><span>{{ nd.arch }}<\u002Fspan><span>·<\u002Fspan><span>{{ nd.driver }}<\u002Fspan><sc-if value=\"{{ nd.hasGpu }}\"><span class=\"chip gpu\">{{ nd.gpus }}<\u002Fspan><\u002Fsc-if><span class=\"sp\"><\u002Fspan><span title=\"last report\">last seen <span class=\"m\" title=\"{{ nd.seenTitle }}\">{{ nd.seen }}<\u002Fspan><\u002Fspan><\u002Fdiv><sc-if value=\"{{ nd.empty }}\"><p class=\"mut2 m\">No instances.<\u002Fp><\u002Fsc-if><sc-if value=\"{{ nd.has }}\"><ul><sc-for list=\"{{ nd.instances }}\" as=\"i\"><li class=\"s-{{ i.kind }}\"><span class=\"chip s-{{ i.kind }}\"><span class=\"led\" aria-hidden=\"true\"><\u002Fspan>{{ i.phase }}<\u002Fspan><span>{{ i.label }}<\u002Fspan><span class=\"age\" title=\"time in this phase\">{{ i.age }}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fsc-if><\u002Farticle><\u002Fsc-for><\u002Fdiv><\u002Fsection><\u002Fsc-for><\u002Fdiv>\n<sc-if value=\"{{ ST.hasElsewhere }}\"><section class=\"col\"><h2 class=\"disp\" style=\"font-size: 32px; margin: 0\">Not on a listed node<\u002Fh2><article class=\"snode s-end\"><ul><sc-for list=\"{{ ST.elsewhere }}\" as=\"i\"><li class=\"s-{{ i.kind }}\"><span class=\"chip s-{{ i.kind }}\"><span class=\"led\" aria-hidden=\"true\"><\u002Fspan>{{ i.phase }}<\u002Fspan><span>{{ i.label }}<\u002Fspan><sc-if value=\"{{ i.hasNode }}\"><span class=\"mut m\">{{ i.onNode }}<\u002Fspan><\u002Fsc-if><span class=\"age\" title=\"time in this phase\">{{ i.age }}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Ful><\u002Farticle><\u002Fsection><\u002Fsc-if>\n<\u002Fmain>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n// Warden web app (web/src), running on the same sample data as `VITE_MOCK_API=1 pnpm dev`.\n// Hash routes mirror routes.ts; pages, copy and classes follow web/src/pages and web/src/theme.css.\nconst DAY = 86400000;\nconst MIN = 60000;\n\nconst ACCOUNTS = {\n  customer: { email: \"customer@demo.local\", org: \"acme\" },\n  partner: { email: \"partner@demo.local\", org: \"demo-dc\" },\n  operator: { email: \"operator@demo.local\", org: \"kondukter\" },\n};\nconst PASSWORD = \"cj\";\nconst HOME = { customer: \"/app/instances\", partner: \"/partner/nodes\", operator: \"/admin/nodes\" };\nconst AREA_ROLE = { app: \"customer\", partner: \"partner\", admin: \"operator\", stage: \"operator\" };\nconst AREAS = {\n  app: { title: \"Customer\", home: \"/app/instances\", shell: true, pages: [\n    { path: \"/app/offers\", title: \"Offers\", nav: true, id: \"offers\" },\n    { path: \"/app/instances\", title: \"Instances\", nav: true, id: \"instances\" },\n    { path: \"/app/instances/new\", title: \"New instance\", id: \"newInstance\" },\n    { path: \"/app/instances/:id\", title: \"Instance\", id: \"instance\" },\n    { path: \"/app/keys\", title: \"Keys\", nav: true, id: \"keys\" },\n    { path: \"/app/usage\", title: \"Usage\", nav: true, id: \"usage\" },\n    { path: \"/app/billing\", title: \"Billing\", nav: true, id: \"billing\" },\n  ] },\n  partner: { title: \"Partner\", home: \"/partner/nodes\", shell: true, pages: [\n    { path: \"/partner/sites\", title: \"Sites\", nav: true, id: \"sites\" },\n    { path: \"/partner/nodes\", title: \"Nodes\", nav: true, id: \"nodes\" },\n    { path: \"/partner/enroll\", title: \"Enroll a node\", nav: true, id: \"enroll\" },\n    { path: \"/partner/utilization\", title: \"Utilization\", nav: true, id: \"utilization\" },\n    { path: \"/partner/earnings\", title: \"Earnings\", nav: true, id: \"earnings\" },\n  ] },\n  admin: { title: \"Operator\", home: \"/admin/nodes\", shell: true, pages: [\n    { path: \"/admin/nodes\", title: \"Nodes\", nav: true, id: \"nodes\" },\n    { path: \"/admin/instances\", title: \"Instances\", nav: true, id: \"adminInstances\" },\n    { path: \"/admin/catalog\", title: \"Catalog\", nav: true, id: \"catalog\" },\n    { path: \"/admin/audit\", title: \"Audit log\", nav: true, id: \"audit\" },\n  ] },\n  stage: { title: \"Stage\", home: \"/stage\", shell: false, pages: [{ path: \"/stage\", title: \"Fleet\", id: \"stage\" }] },\n};\nconst PAGE_IDS = [\"landing\", \"products\", \"login\", \"notfound\", \"offers\", \"instances\", \"newInstance\", \"instance\", \"keys\", \"usage\", \"billing\", \"sites\", \"nodes\", \"enroll\", \"utilization\", \"earnings\", \"adminInstances\", \"catalog\", \"audit\", \"stage\"];\nconst LIVE_PAGES = new Set([\"instances\", \"instance\", \"usage\", \"nodes\", \"adminInstances\", \"stage\"]);\nconst BLURBS = {\n  \"/app/offers\": \"Everything that can be rented right now. Filter by accelerator, architecture and size, then create an instance from any row.\",\n  \"/app/instances\": \"Your virtual machines, live. Phases update as they happen, with running time and an estimated cost.\",\n  \"/app/instances/new\": \"Pick a shape, an image and an SSH key. The scheduler finds the best-fit node and you watch it come up.\",\n  \"/app/instances/:id\": \"One instance from request to termination: lifecycle, connection details, usage and history.\",\n  \"/app/keys\": \"SSH keys let you log in to your instances; API keys let `kctl` and your own tools talk to Warden.\",\n  \"/app/usage\": \"Running time and estimated cost per instance, by the minute.\",\n  \"/app/billing\": \"Your balance, what it was spent on, and how long it lasts.\",\n  \"/partner/earnings\": \"What your lent machines earn, per day and per node, and when you are paid.\",\n  \"/partner/sites\": \"Your datacenter sites, with how many nodes each holds and in what state.\",\n  \"/partner/nodes\": \"Every machine you lend to Warden: inventory, health and how much is free. Never customer data.\",\n  \"/partner/enroll\": \"Add a machine: generate a one-time command, run it on the node, and watch it appear.\",\n  \"/partner/utilization\": \"How much of your lent capacity is in use, per node and over a period.\",\n  \"/admin/nodes\": \"The whole fleet across partners. Quarantine, drain and check that every agent has caught up.\",\n  \"/admin/instances\": \"Every customer instance on every node, with the controls to force one to terminate.\",\n  \"/admin/catalog\": \"What is for sale: offers, shapes, images and regions. Read-only.\",\n  \"/admin/audit\": \"Every privileged action, newest first, with who did it and what changed.\",\n};\n\n// ---------- format (lib/format.ts) ----------\nconst EUR = new Intl.NumberFormat(\"en\", { style: \"currency\", currency: \"EUR\" });\nconst money = (c) => (c == null ? \"—\" : EUR.format(c / 100));\nfunction eur(minor, signed) {\n  const t = EUR.format(Math.abs(minor) / 100);\n  if (!signed) return minor < 0 ? `−${t}` : t;\n  return `${minor < 0 ? \"−\" : \"+\"}${t}`;\n}\nconst FMT_EUR = (v) => eur(Math.round(v));\nconst fmtMiB = (n) => (n < 1024 ? `${n} MiB` : `${Number.isInteger(n / 1024) ? n / 1024 : (n / 1024).toFixed(1)} GiB`);\nconst fmtGiB = (n) => `${n} GiB`;\nconst fmtMin = (m) => (m == null ? \"—\" : `${m} min`);\nconst fmtTs = (ms) => (ms ? new Date(ms).toLocaleString(undefined, { dateStyle: \"medium\", timeStyle: \"medium\" }) : \"—\");\nfunction fmtDur(sec) {\n  const s = Math.max(0, Math.floor(sec));\n  if (s < 60) return `${s} s`;\n  const m = Math.floor(s / 60);\n  if (m < 60) return `${m} min ${String(s % 60).padStart(2, \"0\")} s`;\n  return `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, \"0\")} min`;\n}\nconst fmtAge = (ms, now) => (ms ? fmtDur((now - ms) / 1000) : \"—\");\nconst pad2 = (n) => String(n).padStart(2, \"0\");\nconst clock = (ms) => { const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };\nconst shortId = (id) => id.slice(0, 8);\nconst withReason = (l, r) => (r ? `${l} (${r})` : l);\nconst rand = (n, abc) => Array.from({ length: n }, () => abc[Math.floor(Math.random() * abc.length)]).join(\"\");\nconst HEX = \"0123456789abcdef\";\nconst B64 = \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/\";\nconst B62 = \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789\";\n\nconst PHASE_KIND = { pending: \"pend\", scheduled: \"sched\", provisioning: \"prov\", running: \"run\", unreachable: \"unr\", failed: \"fail\", lost: \"fail\", terminating: \"drain\", terminated: \"end\" };\nconst NODE_KIND = { enrolling: \"pend\", ready: \"run\", draining: \"drain\", maintenance: \"drain\", unreachable: \"unr\", quarantined: \"quar\", retired: \"end\" };\nconst TRANSITIONAL = new Set([\"pending\", \"scheduled\", \"provisioning\", \"terminating\"]);\nconst TERMINAL = new Set([\"terminated\", \"failed\", \"lost\"]);\nconst canTerminate = (p) => ![\"terminating\", \"terminated\", \"failed\", \"lost\"].includes(p);\nconst NODE_STATUSES = [\"enrolling\", \"ready\", \"draining\", \"maintenance\", \"unreachable\", \"quarantined\", \"retired\"];\nconst AUDIT_ACTIONS = [\"admin.quarantine_node\", \"admin.unquarantine_node\", \"admin.force_terminate_instance\", \"partner.create_enrollment_token\", \"partner.drain_node\", \"partner.undrain_node\", \"instance.terminate\"];\n\n// ---------- catalog (test/fakeApi.ts demoCatalog) , n.gpus.length, share(used, n.gpus.length, id)),\n        active: n.active, minutesN: custom ? 0 : n.active * 90,\n      };\n    });\n    rows.forEach((x) => { x.minutes = fmtMin(x.minutesN); });\n    return { SF: this.siteFilter(r, db), UT: {\n      from: s.util.from, to: s.util.to,\n      submit: (e) => { e.preventDefault(); const d = new FormData(e.currentTarget); this.setState({ util: { from: String(d.get(\"from\") || \"\"), to: String(d.get(\"to\") || \"\") } }); },\n      period: `${fmtTs(start)} to ${fmtTs(end)}`, total: fmtMin(rows.reduce((t, x) => t + x.minutesN, 0)), count: rows.length,\n      rows, has: rows.length > 0, none: rows.length === 0,\n    } };\n  }\n\n  v_earnings({ now }) {\n    if (!this._earn) this._earn = earnings(now);\n    const e = this._earn;\n    const paid = e.payouts.filter((p) => p.status === \"paid\").reduce((t, p) => t + p.amount, 0);\n    return { EA: {\n      earned: eur(e.total), next: eur(e.payouts[0].amount), util: `${Math.round(e.nodes.reduce((t, n) => t + n.utilization, 0) / e.nodes.length)}%`, lifetime: eur(e.total + paid),\n      daily: e.daily, fmt: FMT_EUR,\n      nodes: e.nodes.map((n) => ({ node: n.node, kind: n.kind, hours: `${n.hours} h`, util: rbar(n.utilization, 100, `${n.utilization}%`), earned: eur(n.earned) })),\n      payouts: e.payouts.map((p) => ({ id: p.id, date: new Date(p.date).toLocaleDateString(\"en\", { dateStyle: \"medium\" }), method: p.method, amount: eur(p.amount), status: p.status, kind: p.status === \"paid\" ? \"run\" : \"pend\" })),\n    } };\n  }\n\n  v_adminInstances({ now, r, db }) {\n    const all = r.q.all === \"1\";\n    const nodeQ = r.q.node || \"\";\n    const orgQ = r.q.org || \"\";\n    const host = (id) => { const n = db.nodes.find((x) => x.id === id); return (n && n.hostname) || shortId(id); };\n    const rows = [...db.fleet].sort((a, b) => b.createdAt - a.createdAt).filter((i) => (all || !TERMINAL.has(i.phase)) && (!nodeQ || i.nodeId === nodeQ) && (!orgQ || i.orgId === orgQ));\n    const orgRow = db.fleet.find((i) => i.orgId === orgQ);\n    return { AI: {\n      all, toggleAll: (e) => this.setParam(\"all\", e.target.checked ? \"1\" : \"\"),\n      filtered: !!(nodeQ || orgQ), hasNode: !!nodeQ, hasOrg: !!orgQ, nodeName: nodeQ ? host(nodeQ) : \"\", orgName: orgRow ? orgRow.orgName : shortId(orgQ),\n      anyNode: () => this.setParam(\"node\", \"\"), anyOrg: () => this.setParam(\"org\", \"\"),\n      has: rows.length > 0, none: rows.length === 0,\n      empty: all || nodeQ || orgQ ? \"No instances match the filter.\" : \"No active instances.\",\n      rows: rows.map((i) => ({\n        id: i.id, short: shortId(i.id), name: i.name || \"—\", org: i.orgName || shortId(i.orgId), pickOrg: () => this.setParam(\"org\", i.orgId),\n        kind: PHASE_KIND[i.phase], phase: withReason(i.phase, i.phaseReason), age: TERMINAL.has(i.phase) ? \"—\" : fmtAge(i.phaseChangedAt, now),\n        hasNode: !!i.nodeId, noNode: !i.nodeId, node: i.nodeId ? host(i.nodeId) : \"\", pickNode: () => this.setParam(\"node\", i.nodeId),\n        offer: `${i.shape.name}, ${money(i.price)}/h`, offerId: i.offerId, region: i.region, arch: i.arch || \"—\", created: fmtTs(i.createdAt),\n        msg: `Force terminate ${i.name || shortId(i.id)} of ${i.orgName || shortId(i.orgId)}? Its VM is deleted now and the customer cannot undo it.`,\n        noTerm: !canTerminate(i.phase), terminate: (reason) => this.forceTerminate(i, reason),\n      })),\n    } };\n  }\n\n  v_audit({ r, db }) {\n    const action = r.q.action || \"\";\n    const actor = r.q.actor || \"\";\n    const entries = db.audit.filter((e) => (!action || e.action === action) && (!actor || e.actorId === actor)).sort((a, b) => b.id - a.id).slice(0, 50);\n    const named = db.audit.find((e) => e.actorId === actor);\n    return { A: {\n      action, setAction: (e) => this.setParam(\"action\", e.target.value, [\"page\"]),\n      actions: AUDIT_ACTIONS.map((x) => ({ v: x })), hasActor: !!actor, actorName: named ? named.actorDisplay : actor, anyActor: () => this.setParam(\"actor\", \"\", [\"page\"]),\n      has: entries.length > 0, none: entries.length === 0, empty: action || actor ? \"No entries match the filter.\" : \"The audit log is empty.\",\n      rows: entries.map((e) => {\n        const [type, id] = e.target.split(\"/\", 2);\n        const has = e.payload && Object.keys(e.payload).length > 0;\n        const line = has ? JSON.stringify(e.payload) : \"\";\n        return {\n          time: fmtTs(e.at), actor: e.actorDisplay || e.actorId, actorType: e.actorType.replace(\"_\", \" \"), pickActor: () => this.setParam(\"actor\", e.actorId, [\"page\"]),\n          action: e.action, target: id ? `${type}/${shortId(id)}` : e.target, targetFull: e.target,\n          hasPayload: has, noPayload: !has, payloadLine: line.length > 80 ? `${line.slice(0, 79)}…` : line, payloadPretty: has ? JSON.stringify(e.payload, null, 2) : \"\",\n        };\n      }),\n    } };\n  }\n\n  v_stage({ now, r, db }) {\n    const demo = r.q.demo === \"1\";\n    const nodes = db.nodes.filter((n) => n.status !== \"retired\").sort((a, b) => a.hostname.localeCompare(b.hostname, undefined, { numeric: true }));\n    const known = new Set(nodes.map((n) => n.id));\n    const live = db.fleet.filter((i) => !TERMINAL.has(i.phase)).sort((a, b) => a.createdAt - b.createdAt || a.id.localeCompare(b.id));\n    const row = (i) => ({\n      kind: PHASE_KIND[i.phase], phase: i.phase === \"running\" ? i.phase : withReason(i.phase, i.phaseReason),\n      label: demo ? i.name || shortId(i.id) : i.name ? `${i.name} (${i.id})` : i.id, age: fmtAge(i.phaseChangedAt, now),\n      onNode: i.nodeId ? `on node ${shortId(i.nodeId)}` : \"\", hasNode: !!i.nodeId,\n    });\n    const sites = [];\n    nodes.forEach((n) => {\n      let g = sites.find((x) => x.key === n.siteId);\n      if (!g) { g = { key: n.siteId, name: n.siteName, partner: n.partnerName, nodes: [] }; sites.push(g); }\n      const mine = live.filter((i) => i.nodeId === n.id).map(row);\n      const seen = lastSeenOf(n, now);\n      g.nodes.push({ name: n.hostname || shortId(n.id), kind: NODE_KIND[n.status], status: withReason(n.status, n.statusReason), arch: n.arch || \"?\", driver: n.driver || \"?\",\n        hasGpu: n.gpus.length > 0, gpus: n.gpus.map((a) => a.model || a.kind).join(\", \"), seen: seen ? `${fmtAge(seen, now)} ago` : \"never\", seenTitle: fmtTs(seen),\n        instances: mine, has: mine.length > 0, empty: mine.length === 0 });\n    });\n    const elsewhere = live.filter((i) => !i.nodeId || !known.has(i.nodeId)).map(row);\n    return { ST: {\n      clock: clock(now), updated: clock(now - (now % 2000)),\n      sites, none: sites.length === 0, elsewhere, hasElsewhere: elsewhere.length > 0,\n    } };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
