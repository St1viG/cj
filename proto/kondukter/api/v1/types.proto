syntax = "proto3";

// Package kondukter.api.v1 is the public Connect API used by kctl and the
// web app (SPEC §6.7, ADR-0006). Every mutating request carries an
// idempotency_key: a client-chosen string, unique per org, remembered for
// 24 h; a retry with the same key returns the first result.
package kondukter.api.v1;

import "google/protobuf/timestamp.proto";

// Role is derived from org membership (ADR-0021).
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_CUSTOMER = 1;
  ROLE_PARTNER = 2;
  ROLE_OPERATOR = 3;
}

// InstancePhase is the SPEC §6.3 instance state machine.
enum InstancePhase {
  INSTANCE_PHASE_UNSPECIFIED = 0;
  INSTANCE_PHASE_PENDING = 1;
  INSTANCE_PHASE_SCHEDULED = 2;
  INSTANCE_PHASE_PROVISIONING = 3;
  INSTANCE_PHASE_RUNNING = 4;
  INSTANCE_PHASE_TERMINATING = 5;
  INSTANCE_PHASE_TERMINATED = 6;
  INSTANCE_PHASE_UNREACHABLE = 7;
  INSTANCE_PHASE_LOST = 8;
  INSTANCE_PHASE_FAILED = 9;
}

// NodeStatus is the SPEC §6.4 node lifecycle.
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_ENROLLING = 1;
  NODE_STATUS_READY = 2;
  NODE_STATUS_DRAINING = 3;
  NODE_STATUS_MAINTENANCE = 4;
  NODE_STATUS_UNREACHABLE = 5;
  NODE_STATUS_QUARANTINED = 6;
  NODE_STATUS_RETIRED = 7;
}

// CapacityClass of an offer or node. Only DEDICATED in the demo (ADR-0025).
enum CapacityClass {
  CAPACITY_CLASS_UNSPECIFIED = 0;
  CAPACITY_CLASS_DEDICATED = 1;
  CAPACITY_CLASS_PREEMPTIBLE = 2;
}

// AcceleratorHealth as Kondukter last saw it.
enum AcceleratorHealth {
  ACCELERATOR_HEALTH_UNSPECIFIED = 0;
  ACCELERATOR_HEALTH_OK = 1;
  ACCELERATOR_HEALTH_UNAVAILABLE = 2;
  // No longer reported by the agent but still held by an allocation.
  ACCELERATOR_HEALTH_MISSING = 3;
}

// Protocol is a transport protocol for an exposed port.
enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_TCP = 1;
  PROTOCOL_UDP = 2;
}

// Money is an amount in integer minor units (cents).
message Money {
  int64 amount_minor = 1;
  // ISO 4217, e.g. "EUR".
  string currency = 2;
}

// ResourceAmounts is an amount of compute capacity.
message ResourceAmounts {
  uint32 vcpu = 1;
  uint64 ram_mib = 2;
  uint64 disk_gib = 3;
}

// PortSpec is a guest port the customer wants reachable.
message PortSpec {
  uint32 guest_port = 1;
  Protocol protocol = 2;
}

// PortMapping is where a guest port is reachable.
message PortMapping {
  uint32 guest_port = 1;
  Protocol protocol = 2;
  string host_address = 3;
  uint32 host_port = 4;
}

// Usage is the demo's metering view (ADR-0023): no money moves.
message Usage {
  int64 running_seconds = 1;
  // ceil(running_seconds / 60).
  int64 running_minutes = 2;
  // running_minutes x price_per_hour_minor / 60, in the offer's currency.
  Money estimated_cost = 3;
}

// User is a seeded login (ADR-0021).
message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
}

// Org is a customer org, a partner, or the operator org.
message Org {
  string id = 1;
  string name = 2;
}

// Node is a host running kondukter-agent. Contains no customer data, so
// partners and operators share the message.
message Node {
  string id = 1;
  string site_id = 2;
  string site_name = 3;
  string partner_id = 4;
  string partner_name = 5;
  string hostname = 6;
  NodeStatus status = 7;
  string status_reason = 8;
  // "amd64" | "arm64".
  string arch = 9;
  string os = 10;
  // "libvirt" | "lima" | "mock".
  string driver = 11;
  string agent_version = 12;
  CapacityClass capacity_class = 13;
  NodeCapacity capacity = 14;
  repeated NodeAccelerator accelerators = 15;
  uint32 active_instance_count = 16;
  google.protobuf.Timestamp last_seen_at = 17;
  uint64 desired_generation = 18;
  uint64 observed_generation = 19;
  map<string, string> labels = 20;
  string advertise_address = 21;
  // "name@digest" of every image in the node's cache.
  repeated string cached_images = 22;
  google.protobuf.Timestamp created_at = 23;
}

// NodeCapacity breaks a node's resources down; free = total - reserved -
// allocated.
message NodeCapacity {
  ResourceAmounts total = 1;
  ResourceAmounts reserved = 2;
  ResourceAmounts allocated = 3;
  ResourceAmounts free = 4;
}

// NodeAccelerator is one device on a node.
message NodeAccelerator {
  string id = 1;
  // "nvidia" | "apple-metal" | "mock".
  string kind = 2;
  string model = 3;
  uint64 mem_mib = 4;
  string pci_address = 5;
  AcceleratorHealth health = 6;
  string health_reason = 7;
  // Held by an active allocation.
  bool allocated = 8;
}
