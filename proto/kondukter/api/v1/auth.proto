syntax = "proto3";

package kondukter.api.v1;

import "kondukter/api/v1/types.proto";

// AuthService handles browser sessions for the seeded demo accounts
// (ADR-0021). Login and Logout carry no idempotency key: they only create or
// drop the caller's own session and are safe to retry.
service AuthService {
  // Login checks email and password and sets an HttpOnly session cookie.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Logout ends the current session and clears the cookie.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // GetMe returns the caller, authenticated by session cookie or API key.
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  Principal principal = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message GetMeRequest {}

message GetMeResponse {
  Principal principal = 1;
}

// Principal is who the caller is and what they may do.
message Principal {
  User user = 1;
  Org org = 2;
  Role role = 3;
  // Set for ROLE_PARTNER: the partner whose sites the caller manages.
  string partner_id = 4;
}
