# Kondukter control-plane stack (ADR-0014). Run it through the Makefile
# (`make db-up`, `make db-down`, `make db-psql`), which passes the env file:
# `.env` at the repo root if present, else `.env.example`.
name: kondukter

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kondukter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kondukter}
      POSTGRES_DB: ${POSTGRES_DB:-kondukter}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Placeholder until P3: the binary only prints its version. The `app`
  # profile keeps it out of `make db-up`; P4.3 makes it a default service.
  kondukter:
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/compose/kondukter.Dockerfile
      args:
        VERSION: ${KONDUKTER_VERSION:-dev}
    environment:
      KONDUKTER_DATABASE_URL: postgres://${POSTGRES_USER:-kondukter}:${POSTGRES_PASSWORD:-kondukter}@postgres:5432/${POSTGRES_DB:-kondukter}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
